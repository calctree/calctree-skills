name: Release skill zip

# Publishes one numbered release per version. The version comes from
# .claude-plugin/plugin.json (skills/calctree/VERSION must match). Pushing to main
# without bumping it does nothing: the tag already exists, so the run skips.

on:
  push:
    branches: [main]
    paths:
      - "skills/calctree/**"
      - "tools/package_skill.py"
      - "tools/release_info.py"
      - ".claude-plugin/plugin.json"
      - "CHANGELOG.md"
      - ".github/workflows/release-skill.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-skill
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          version="$(python tools/release_info.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists, so there is nothing to release. Bump the version in .claude-plugin/plugin.json and skills/calctree/VERSION, and add a CHANGELOG.md entry, to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist yet: releasing."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.tag.outputs.exists == 'false'
        run: python tools/package_skill.py --out dist

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          footer="Download [calctree.zip](https://github.com/calctree/calctree-skills/releases/latest/download/calctree.zip) and upload it under Settings > Features > Skills in claude.ai or the Claude desktop app. In Claude Code, run \`/plugin marketplace update calctree\`."
          if python tools/release_info.py notes "$VERSION" > dist/notes.md; then
            printf '\n\n%s\n' "$footer" >> dist/notes.md
            gh release create "$TAG" dist/calctree.zip \
              --target "$GITHUB_SHA" \
              --title "CalcTree skill $TAG" \
              --notes-file dist/notes.md \
              --latest
          else
            echo "No CHANGELOG.md section for $VERSION: falling back to generated notes."
            gh release create "$TAG" dist/calctree.zip \
              --target "$GITHUB_SHA" \
              --title "CalcTree skill $TAG" \
              --notes "$footer" \
              --generate-notes \
              --latest
          fi
